[project]
name = "scopegate"
version = "1.0.0"
description = "Explicit organization access operations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "pydantic-settings>=2.5,<3",
  "email-validator>=2.2,<3",
  "PyJWT[crypto]>=2.9,<3", "cryptography>=43", "httpx>=0.27,<1",
  "prometheus-client>=0.21,<1", "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2", "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9", "mypy>=1.13,<2", "jsonschema>=4.23,<5", "openapi-spec-validator>=0.7,<1", "pip-audit>=2.7,<3", "radon>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scopegate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: real PostgreSQL service behavior", "identity: local OIDC integration", "migration: synthetic migration", "operations: delivery and recovery faults", "security: negative trust-boundary checks", "performance: measured bounded workload"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
