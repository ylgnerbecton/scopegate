name: Specifications

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  specifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: make check
      - run: make check-validators
