name: Local product verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.12'
      - run: make deps
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: docker compose up --build --wait --wait-timeout 180
      - run: make verify
      - run: make check-evidence package
      - if: always()
        run: docker compose down
